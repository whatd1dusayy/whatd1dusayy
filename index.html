<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="메모장에 적어둔 한 줄이면 충분해요. 왓디쥬세이에 당신의 끄적임을 보내주세요.">
<meta property="og:title" content="당신의 끄적임을 기다립니다 · 왓디쥬세이">
<meta property="og:description" content="메모장에 적어둔 한 줄이면 충분해요.">
<meta name="theme-color" content="#1A1AE6">
<title>왓디쥬세이 투고함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 레이아웃: 파랑 한 장. 손글씨 타이틀 → 바로 쓰는 줄칸 → 빈칸 한 문장 → 오렌지 버튼. 폰 한 화면 안에 다 들어가게. */
:root{
  --bg:#1A1AE6;
  --fg:#FFFFFF;
  --fg-soft:rgba(255,255,255,.72);
  --rule:rgba(255,255,255,.5);
  --orange:#FF5B14;
  --ink:#111111;
  --f-body:"Gowun Batang","AppleMyungjo","Nanum Myeongjo","Batang",serif;
  --line:2.05rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:hidden}
.page{
  max-width:560px;margin:0 auto;
  padding-block:18px 28px;
  padding-left:max(18px, env(safe-area-inset-left, 0px));
  padding-right:max(18px, env(safe-area-inset-right, 0px));
  display:grid;gap:16px;
}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--fg-soft);letter-spacing:.02em}
.top a{color:var(--fg);text-decoration:none;font-weight:700}

.hero{position:relative;margin-top:4px}
.hero h1{margin:0}
.hero .title{display:block;width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spark{position:absolute;pointer-events:none;height:auto}
.spark.a{width:17%;right:-3%;top:-9%;transform:rotate(14deg)}
.spark.b{width:21%;left:-4%;bottom:-16%;transform:rotate(-8deg)}
@media (prefers-reduced-motion:no-preference){
  .spark.a{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{transform:rotate(14deg) scale(1)}50%{transform:rotate(26deg) scale(.86)}}
}
.lede{margin:6px 0 0;font-size:1rem;color:var(--fg)}

form{display:grid;gap:16px}
.write{display:grid;gap:4px}
.write-head{display:flex;justify-content:space-between;font-size:.8rem;color:var(--fg-soft)}
#text{
  width:100%;height:calc(var(--line) * 5 + 2px);resize:vertical;min-height:calc(var(--line) * 2);
  border:0;outline:none;color:var(--fg);caret-color:var(--orange);
  font-family:var(--f-body);font-weight:700;font-size:17px;
  line-height:var(--line);padding:0 2px;
  background-color:transparent;
  background-image:linear-gradient(to top, var(--rule) 1px, transparent 1px);
  background-size:100% var(--line);
  background-attachment:local;
  border-top:1px solid var(--rule);
}
#text::placeholder{color:var(--fg-soft);font-weight:400}
.metaline{font-weight:700;color:var(--orange);font-size:.92rem;line-height:1.4}
.count{font-variant-numeric:tabular-nums}

.madlib{margin:0;font-size:1.02rem;line-height:2.35}
.madlib input{
  font-family:var(--f-body);font-weight:700;font-size:16px;color:var(--fg);
  border:0;border-bottom:1.5px solid var(--fg);border-radius:0;background:transparent;outline:none;
  padding:0 4px 1px;margin:0 2px;text-align:center;
  field-sizing:content;min-width:5em;max-width:100%;
}
.madlib input::placeholder{color:var(--fg-soft);font-weight:400}
.madlib input:focus{border-bottom-color:var(--orange)}
.madlib input:disabled{opacity:.4}

.checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;line-height:1.4}
.check input{appearance:none;margin:0;width:19px;height:19px;flex:none;border:1.5px solid var(--fg);background:transparent;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--orange);border-color:var(--orange)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.submit{
  width:100%;
  font-family:var(--f-body);font-weight:700;font-size:1.15rem;letter-spacing:.01em;
  background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:0;
  padding:15px 20px;cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s, box-shadow .1s;
}
.submit:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.submit:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.submit:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.submit[disabled]{opacity:.7;cursor:wait}
.err{color:#FFD7C4;font-weight:700;font-size:.92rem;margin:-6px 0 0}

/* 완료 / 안내 */
.panel{display:grid;gap:14px;padding-top:6px}
.panel h2{margin:0;font-weight:700;font-size:1.6rem;letter-spacing:-.02em}
.panel p{margin:0}
.quote{font-weight:700;font-size:1.06rem;line-height:1.9;border-left:3px solid var(--orange);padding-left:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--f-body);font-weight:700;font-size:1rem;padding:12px 20px;border-radius:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;border:2px solid var(--fg);background:transparent;color:var(--fg)}
.btn.primary{background:var(--orange);border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
#copySrc{width:100%;font-family:var(--f-body);font-size:16px;border:1.5px solid var(--rule);background:transparent;color:var(--fg);padding:10px;resize:vertical}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<main class="page">
  <div class="top"><span>왓디쥬세이</span><a href="https://www.instagram.com/whatd1dusayy/" target="_blank" rel="noopener">@whatd1dusayy</a></div>

  <header class="hero">
    <h1><img class="title" src="assets/title.webp" width="2000" height="934" alt="당신의 끄적임을 기다립니다"></h1>
    <img class="spark a" src="assets/spark-orange.png" alt="" aria-hidden="true">
  </header>

  <p class="lede">메모장에 적어둔 한 줄이면 충분해요. 뽑힌 글은 카드로 만들어 피드에 올려요.</p>

  <form id="form" novalidate>
    <div class="write">
      <div class="write-head"><label for="text">여기에 바로 끄적여 주세요</label><span class="count" id="count">0 / 1000</span></div>
      <textarea id="text" name="text" maxlength="1000" placeholder="요즘 머릿속에 맴도는 문장 하나." required></textarea>
      <div class="metaline" id="metaline" aria-live="polite"></div>
    </div>

    <p class="madlib">
      저는 <input type="text" id="area" maxlength="30" placeholder="동네" autocomplete="off" aria-label="동네 (선택)">에 사는
      <input type="text" id="name" maxlength="20" placeholder="이름" autocomplete="off" aria-label="이름 (선택)">이고,
      <span style="white-space:nowrap">인스타는</span> <input type="text" id="insta" maxlength="40" placeholder="@아이디" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="인스타 아이디 (선택)">예요.
    </p>

    <div class="checks">
      <label class="check"><input type="checkbox" id="anon"> 익명으로 실어주세요</label>
      <label class="check"><input type="checkbox" id="consent" required> 피드에 실려도 괜찮아요</label>
    </div>

    <div class="sr" aria-hidden="true"><label for="hp">비워두세요</label><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
    <button class="submit" type="submit" id="submit">끄적임 보내기</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>

  <section class="panel" id="done" hidden>
    <h2>잘 받았어요.</h2>
    <div class="quote" id="doneQuote"></div>
    <div class="metaline" id="doneMeta"></div>
    <p>카드로 만들어지면 인스타에서 먼저 알려드릴게요.</p>
    <div class="btns">
      <a class="btn primary" href="https://www.instagram.com/whatd1dusayy/" target="_blank" rel="noopener">@whatd1dusayy 팔로우하기</a>
      <button class="btn" type="button" id="again">하나 더 쓰기</button>
    </div>
  </section>

  <section class="panel" id="fallback" hidden>
    <p><b>이 화면에서는 바로 저장이 안 돼요.</b> 글을 복사해서 인스타 @whatd1dusayy DM으로 보내주세요.</p>
    <textarea id="copySrc" rows="4" readonly></textarea>
    <div class="btns">
      <button class="btn primary" type="button" id="copy">글 복사하기</button>
      <a class="btn" href="https://www.instagram.com/whatd1dusayy/" target="_blank" rel="noopener">인스타 열기</a>
    </div>
  </section>
</main>

<script>
/* 외부(친구 웹/깃허브 페이지 등)에 올릴 때: 구글 Apps Script 웹앱 URL을 넣으면 그쪽으로 저장돼요. */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbw2GvfwBWegTbHf469xl5TS_bPGi4AFcGLBlP-QLwjhIdNB_NKrXvdDPh3_0YEAf5awlg/exec";

const $ = id => document.getElementById(id);
const form = $("form"), text = $("text"), area = $("area"), nameEl = $("name"), anon = $("anon"),
      insta = $("insta"), consent = $("consent"), err = $("err"), btn = $("submit");

let db = null, uid = null;
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if (user) uid = await user.id();
  } catch (e) { db = null; }
})();

const autoSize = !(window.CSS && CSS.supports && CSS.supports("field-sizing","content"));
function fit(el){
  if (!autoSize) return;
  const s = el.value || el.placeholder;
  let w = 0; for (const ch of s) w += /[ㄱ-힝]/.test(ch) ? 1 : .58;
  el.style.width = Math.max(w + 1, 5) + "em";
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}.`;
}
function metaText() {
  const a = area.value.trim();
  return `${today()} ${a ? a + " " : ""}어딘가에서.`;
}
function sync() {
  $("count").textContent = `${text.value.length} / 1000`;
  $("metaline").textContent = metaText();
  nameEl.disabled = anon.checked;
  [area, nameEl, insta].forEach(fit);
  try { localStorage.setItem("wdus-draft", JSON.stringify({t:text.value,a:area.value,n:nameEl.value,i:insta.value})); } catch(e){}
}
try {
  const d = JSON.parse(localStorage.getItem("wdus-draft") || "null");
  if (d) { text.value=d.t||""; area.value=d.a||""; nameEl.value=d.n||""; insta.value=d.i||""; }
} catch(e){}
[text, area, nameEl, insta].forEach(el => el.addEventListener("input", sync));
anon.addEventListener("change", sync);
sync();

function showErr(msg){ err.textContent = msg; err.hidden = false; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.hidden = true;
  const body = text.value.trim();
  if (!body) { showErr("아직 아무것도 안 썼어요. 한 줄만 써도 돼요."); text.focus(); return; }
  if (!consent.checked) { showErr("‘피드에 실려도 괜찮아요’에 체크해야 보낼 수 있어요."); consent.focus(); return; }

  const payload = {
    text: body,
    area: area.value.trim(),
    meta: metaText(),
    name: anon.checked ? "" : nameEl.value.trim(),
    anonymous: anon.checked,
    insta: insta.value.trim().replace(/^@+/, ""),
    consent: true,
    hp: $("hp").value,
    createdAt: Date.now()
  };

  btn.disabled = true; btn.textContent = "보내는 중…";
  try {
    if (db && uid) {
      await db.collection(`submissions/${uid}/posts`).add(payload);
    } else if (SUBMIT_URL && SUBMIT_URL.startsWith("https://")) {
      await fetch(SUBMIT_URL, { method: "POST", mode: "no-cors", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
    } else {
      $("copySrc").value = `${payload.text}\n\n${payload.meta}${payload.name ? "\n— " + payload.name : ""}`;
      form.hidden = true; document.querySelector(".lede").hidden = true; $("fallback").hidden = false;
      return;
    }
    $("doneQuote").textContent = payload.text;
    $("doneMeta").textContent = payload.meta + (payload.name ? `  — ${payload.name}` : "");
    form.hidden = true; document.querySelector(".lede").hidden = true; $("done").hidden = false;
    try { localStorage.removeItem("wdus-draft"); } catch(e){}
  } catch (e2) {
    showErr("전송이 안 됐어요. 잠깐 뒤에 다시 눌러주세요. 계속 안 되면 인스타 DM으로 보내주세요.");
  } finally {
    btn.disabled = false; btn.textContent = "끄적임 보내기";
  }
});

$("again").addEventListener("click", () => {
  text.value = ""; consent.checked = false; sync();
  $("done").hidden = true; document.querySelector(".lede").hidden = false; form.hidden = false; text.focus();
});

$("copy").addEventListener("click", () => {
  const src = $("copySrc");
  navigator.clipboard.writeText(src.value).then(
    () => { $("copy").textContent = "복사됐어요"; },
    () => { src.focus(); src.select(); }
  );
});
</script>

</body>
</html>
